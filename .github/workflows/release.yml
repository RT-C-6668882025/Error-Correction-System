name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，形如 1.0.0（不带 v）'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本号
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # 算法层不过就不发版
      - name: 算法层单元测试
        run: ./gradlew -p logic-tests test --no-daemon

      - name: 准备签名密钥
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "未配置 KEYSTORE_BASE64，本次用 debug 密钥签名，产物可安装但不可上架。"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: assembleRelease
        env:
          KEYSTORE_FILE: ${{ steps.signing.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PversionName=${{ steps.version.outputs.version }} \
            -PversionCode=${{ github.run_number }}

      - name: 重命名产物
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          DEST="ecs-${{ steps.version.outputs.version }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$DEST" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: 写发版说明
        run: |
          {
            echo "错题元数据系统 · ${{ steps.version.outputs.tag }}"
            echo
            echo "语法填空 + 完成句子的错题字段库，Android 原生（minSdk 26）。"
            echo
            echo "- APK: \`${{ steps.apk.outputs.path }}\`"
            echo "- SHA256: \`${{ steps.apk.outputs.sha256 }}\`"
            echo "- versionCode: ${{ github.run_number }}"
            if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
              echo
              echo "> 本次用 debug 密钥签名（仓库未配置 KEYSTORE_BASE64）。可直接安装，"
              echo "> 但与正式签名的版本无法互相覆盖升级。"
            fi
            echo
            echo "首次使用：设置页填 API Key → 生成考点树 → 开始录入。"
            echo "识别、标注、报告生成需要联网，其余功能离线可用。"
          } > RELEASE_NOTES.md

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ steps.version.outputs.tag }}
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber
          else
            gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
              --title "$TAG" --notes-file RELEASE_NOTES.md
          fi
