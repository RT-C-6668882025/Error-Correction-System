name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，形如 1.0.0（不带 v）'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本号
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # 算法层不过就不发版
      - name: 算法层单元测试
        run: ./gradlew -p logic-tests test --no-daemon

      - name: 准备签名密钥
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "未配置 KEYSTORE_BASE64，本次用 debug 密钥签名，产物可安装但不可上架。"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: assembleRelease
        env:
          KEYSTORE_FILE: ${{ steps.signing.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PversionName=${{ steps.version.outputs.version }} \
            -PversionCode=${{ github.run_number }}

      - name: 重命名产物
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          DEST="ecs-${{ steps.version.outputs.version }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$DEST" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # 签名指纹要写进发版说明。Android 拒绝跨签名覆盖安装，而在此之前
      # 没有任何地方显示过它——v2.1.0 到 v4.0.1 每一版签名都不同，
      # 却直到用户装不上才发现。
      - name: 读签名指纹
        id: cert
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            FP=$("$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.path }}" \
              | grep -m1 -i 'certificate SHA-256 digest' | awk '{print $NF}')
            echo "签名证书 SHA-256: $FP"
            echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
          else
            echo "找不到 apksigner，跳过指纹"
            echo "fingerprint=" >> "$GITHUB_OUTPUT"
          fi

      - name: 写发版说明
        run: |
          {
            echo "错题元数据系统 · ${{ steps.version.outputs.tag }}"
            echo
            echo "英语填空题的字段库，Android 原生（minSdk 26）。收录判据只有一条："
            echo "一个句子、句中至少一个空。数据分三级，后一级的输入是前一级的输出："
            echo
            echo '    原始数据（题干 + 答案）→ 分析（每题一条）→ 小方向（每板块一棵树）→ 大方向'
            echo
            echo "- APK: \`${{ steps.apk.outputs.path }}\`"
            echo "- SHA256: \`${{ steps.apk.outputs.sha256 }}\`"
            echo "- versionCode: ${{ github.run_number }}"
            if [ -n "${{ steps.cert.outputs.fingerprint }}" ]; then
              echo "- 签名证书 SHA-256: \`${{ steps.cert.outputs.fingerprint }}\`"
            fi
            echo
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              echo "> 用固定密钥签名。只要上面的签名证书指纹和你已装版本一致，"
              echo "> 就能直接覆盖安装，数据不丢。"
              echo ">"
              echo "> **从 v4.0.1 及更早版本升级需要先卸载**：那些版本每次构建都用构建机"
              echo "> 现场随机生成的 debug 密钥，签名互不相同，Android 不允许跨签名覆盖。"
              echo "> 卸载会清空本地数据，先在 设置 → 导出与备份 里导出并分享出去。"
            else
              echo "> ⚠️ 本次退回 debug 密钥签名（仓库未配置 KEYSTORE_BASE64）。"
              echo "> debug 密钥是构建机现场随机生成的，**这个包和任何其他版本都不能互相覆盖**，"
              echo "> 安装前必须先卸载旧版（会清空本地数据）。"
            fi
            echo
            echo "首次使用：录入页顶部填 API Key → 拍照识别 → 确认页逐题标错/蒙对 → 提交。"
            echo "然后到原题页「分析」，再到复习页按板块「汇总小方向」、最后「生成大方向」。"
            echo "识别、分析、汇总需要联网；原题浏览编辑、已汇总的方向、导出与备份离线可用。"
          } > RELEASE_NOTES.md

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ steps.version.outputs.tag }}
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber
          else
            gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
              --title "$TAG" --notes-file RELEASE_NOTES.md
          fi
