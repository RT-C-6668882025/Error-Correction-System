name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic-tests:
    name: 算法层单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # logic-tests 是独立构建，直接编译 app 的 core/ 与 agent/ 源码，不需要 Android SDK
      - name: 跑测试
        run: ./gradlew -p logic-tests test --no-daemon

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logic-test-report
          path: logic-tests/build/reports/tests/test
          if-no-files-found: ignore

  android:
    name: 构建 debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # setup-android 默认还会安装已经从仓库下架的旧 `tools` 包，
          # sdkmanager 因此在真正编译前就失败。只声明本项目实际需要的包。
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: assembleDebug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
